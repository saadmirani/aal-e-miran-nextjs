<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 565" role="img" aria-label="Bazm-e-Saadaat — Roots. Legacy. Light.">
  <defs>
    <radialGradient id="sunGlow" cx="50%" cy="45%" r="55%">
      <stop offset="0%"   stop-color="#f8e89a" stop-opacity="1"/>
      <stop offset="55%"  stop-color="#e8c85a" stop-opacity="0.60"/>
      <stop offset="100%" stop-color="#c9a840" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="medGold" cx="35%" cy="28%" r="70%">
      <stop offset="0%"   stop-color="#f8e080"/>
      <stop offset="60%"  stop-color="#c9a840"/>
      <stop offset="100%" stop-color="#8b6a10"/>
    </radialGradient>
  </defs>

  <!-- ── OUTER CIRCLE ── -->
  <circle cx="250" cy="212" r="198" fill="none" stroke="#1c4a2c" stroke-width="3.5"/>

  <!-- ── GOLDEN SUN GLOW ── -->
  <circle cx="262" cy="278" r="72" fill="url(#sunGlow)"/>

