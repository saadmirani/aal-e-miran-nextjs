    C 155 375 148 350 140 322
    C 133 296 127 272 125 252
    C 123 234 126 220 132 212
    C 126 208 118 210 114 220
    C 108 234 106 256 110 280
    C 114 306 124 334 132 360
    C 138 378 140 394 138 404
    L 158 404 Z
  " fill="#1c4a2c"/>

  <!-- Right/inner trunk with upper extension -->
  <path d="
    M 162 398
    C 162 372 160 348 158 322
    C 156 298 154 278 155 260
    C 156 244 160 232 166 224
    C 172 216 180 212 186 214
    C 192 216 196 226 196 240
    C 196 258 192 278 188 300
    C 184 322 180 348 178 374
    C 176 386 174 396 172 402
    L 162 402 Z
  " fill="#1c4a2c"/>

  <!-- Trunk upper stem going to branches -->
  <path d="
    M 166 250
    C 168 232 172 214 176 196
    C 180 178 186 162 190 147
    C 195 132 198 118 198 103
    C 198 90 196 78 194 70
    L 206 68
    C 208 80 210 94 210 108
    C 210 124 206 140 200 158
    C 194 176 188 196 183 216
    C 178 236 174 258 172 278
    L 162 272 Z
  " fill="#1c4a2c"/>

  <!-- Arabic calligraphic form of ع/آل merged with trunk -->
  <path d="
    M 138 270
    C 126 270 116 280 114 295
    C 112 312 118 330 130 340
    C 140 348 152 349 158 342
    C 152 352 140 360 126 358
    L 122 370
    C 138 374 155 366 164 353
    C 173 340 174 324 168 310
    C 162 296 152 288 145 278
    C 141 270 138 268 138 270 Z
  " fill="#1c4a2c"/>

